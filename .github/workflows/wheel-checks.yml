name: Wheel checks
on:
  push:
    branches: ['codex/midnight-reveals']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-browser-screenshots
          path: test-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-test-build
          path: |
            index.html
            edit.html
            src/
            styles/
            assets/
            examples/
            Start-Wheel.cmd
